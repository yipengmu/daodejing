  - number: 29
    section: 道经
    title: 天下神器
    original_text: "将欲取天下而为之，吾见其不得已。天下神器，不可为也。为者败之，执者失之。夫物或行或随；或歔或吹；或强或羸；或载或隳。是以圣人去甚，去奢，去泰。"
    plain_explanation: "想用强力掌控天下，恐怕难以成功。天下如神妙之器，不可任意摆布；强行作为会失败，紧抓不放会失去。万物各有不同状态和变化，所以圣人去除极端、奢侈和过度。"
