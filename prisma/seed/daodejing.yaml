  - number: 74
    section: 德经
    title: 民不畏死
    original_text: "民不畏死，奈何以死惧之？若使民常畏死，而为奇者，吾得执而杀之，孰敢？常有司杀者杀，夫代司杀者杀，是谓代大匠斫。夫代大匠斫者，希有不伤其手矣。"
    plain_explanation: "百姓若已不怕死，用死刑威胁又有什么用？若人们真都怕死，违法者也可依法处置，但执行生杀并非统治者可任意僭越。自然自有其主宰，统治者代替它滥施杀戮，就像外行替高明木匠砍木头，很少不伤到自己。"
