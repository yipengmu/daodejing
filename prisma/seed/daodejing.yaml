  - number: 68
    section: 德经
    title: 善战善胜
    original_text: "善为士者不武，善战者不怒，善胜敌者不与，善用人者为之下。是谓不争之德，是谓用人之力，是谓配天古之极。"
    plain_explanation: "善于带兵的人不逞勇武，善于作战的人不被愤怒支配，善于胜敌的人不与对手硬碰，善于用人的人谦居其下。这是不争的德，也是在发挥他人的力量，符合自然长久的原则。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。善于带兵的人不逞勇武，善于作战的人不被愤怒支配，善于胜敌的人不与对手硬碰，善于用人的人谦居其下。这是不争的德，也是在发挥他人的力量，符合自然长久的原则。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：善于带兵的人不逞勇武，善于作战的人不被愤怒支配，善于胜敌的人不与对手硬碰，善于用人的人谦居其下。这是不争的德，也是在发挥他人的力量，符合自然长久的原则。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 69
    section: 德经
    title: 进寸退尺
    original_text: "用兵有言，吾不敢为主而为客，不敢进寸而退尺。是谓行无行，攘无臂，扔无敌，执无兵。祸莫大于轻敌，轻敌几丧吾宝。故抗兵相加，哀者胜矣。"
    plain_explanation: "用兵者说，宁愿处于被动防守，不轻率进攻；宁可退让，也不轻易推进。这意味着不摆出进攻阵势、不挥臂挑衅、不树立仇敌、不炫耀兵器。最大的祸患是轻敌，那几乎会使人失去珍视之物。两军相对时，怀着悲悯、不得已而战的一方更可能取胜。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。用兵者说，宁愿处于被动防守，不轻率进攻；宁可退让，也不轻易推进。这意味着不摆出进攻阵势、不挥臂挑衅、不树立仇敌、不炫耀兵器。最大的祸患是轻敌，那几乎会使人失去珍视之物。两军相对时，怀着悲悯、不得已而战的一方更可能取胜。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：用兵者说，宁愿处于被动防守，不轻率进攻；宁可退让，也不轻易推进。这意味着不摆出进攻阵势、不挥臂挑衅、不树立仇敌、不炫耀兵器。最大的祸患是轻敌，那几乎会使人失去珍视之物。两军相对时，怀着悲悯、不得已而战的一方更可能取胜。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 70
    section: 德经
    title: 被褐怀玉
    original_text: "吾言甚易知，甚易行；天下莫能知，莫能行。言有宗，事有君。夫唯无知，是以不我知。知我者希，则我者贵。是以圣人被褐怀玉。"
    plain_explanation: "老子说自己的话本来容易理解、实行，却少有人真正做到，因为人们不了解其中的根本原则。懂他的人少，能践行的人更珍贵。圣人外表穿着粗布，内心却怀有如玉般的德性。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。老子说自己的话本来容易理解、实行，却少有人真正做到，因为人们不了解其中的根本原则。懂他的人少，能践行的人更珍贵。圣人外表穿着粗布，内心却怀有如玉般的德性。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：老子说自己的话本来容易理解、实行，却少有人真正做到，因为人们不了解其中的根本原则。懂他的人少，能践行的人更珍贵。圣人外表穿着粗布，内心却怀有如玉般的德性。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 71
    section: 德经
    title: 圣人不病
    original_text: "知不知，上矣，不知知，病矣。圣人不病，以其病病，夫唯病病，是以不病。"
    plain_explanation: "知道自己有所不知，是高明；不知道却自以为知道，是缺点。圣人没有这种缺点，因为他把缺点当作问题认真对待；正因为能察觉并改正，才不会被无知困住。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：知道自己有所不知，是高明；不知道却自以为知道，是缺点。圣人没有这种缺点，因为他把缺点当作问题认真对待；正因为能察觉并改正，才不会被无知困住。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：知道自己有所不知，是高明；不知道却自以为知道，是缺点。圣人没有这种缺点，因为他把缺点当作问题认真对待；正因为能察觉并改正，才不会被无知困住。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 72
    section: 德经
    title: 民不畏威
    original_text: "民不畏威，则大威至。无狎其所居，无厌其所生。夫唯不厌，是以不厌。是以圣人自知不自见；自爱不自贵。故去彼取此。"
