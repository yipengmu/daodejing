    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：人从出生走向死亡，篇中以古代的比例说生存、死亡以及因过度求生而走向危险的人各占一部分。为什么有人把自己推向死地？因为过分厚待、执着生命。善于养护生命的人不轻易陷入危险境地，因此犀牛、猛虎和兵刃都无从伤害。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 51
    section: 德经
    title: 道生德畜
    original_text: "道生之，德畜之，物形之，势成之。是以万物莫不尊道而贵德。道之尊，德之贵，夫莫之命而常自然。故道生之，德畜之，长之育之，亭之毒之，养之覆之。生而不有，为而不恃，长而不宰，是谓玄德。"
    plain_explanation: "道使万物生成，德使万物得到养育，具体条件赋予形体，环境趋势促成发展。因此万物尊道贵德，这并非命令，而是自然如此。道德生养、培育、保护万物，却不占有、不自恃、不主宰，这就是深远的德。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：道使万物生成，德使万物得到养育，具体条件赋予形体，环境趋势促成发展。因此万物尊道贵德，这并非命令，而是自然如此。道德生养、培育、保护万物，却不占有、不自恃、不主宰，这就是深远的德。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：道使万物生成，德使万物得到养育，具体条件赋予形体，环境趋势促成发展。因此万物尊道贵德，这并非命令，而是自然如此。道德生养、培育、保护万物，却不占有、不自恃、不主宰，这就是深远的德。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 52
    section: 德经
    title: 天下有始
    original_text: "天下有始，以为天下母。既得其母，以知其子；既知其子，复守其母，没身不殆。塞其兑，闭其门，终身不勤。开其兑，济其事，终身不救。见小曰明，守柔曰强。用其光，复归其明，无遗身殃，是为袭常。"
    plain_explanation: "天下有共同的根源，可称为万物之母；认识根源后便能理解万物，理解万物后仍守住根源，终身便不致危险。收敛感官欲望、减少纷扰，可以免于劳困；不断开启欲望、增加事务，则难以挽救。能察觉细微是明，守住柔和是强；运用智慧还要回归内在明澈，避免给自身带来祸患。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。天下有共同的根源，可称为万物之母；认识根源后便能理解万物，理解万物后仍守住根源，终身便不致危险。收敛感官欲望、减少纷扰，可以免于劳困；不断开启欲望、增加事务，则难以挽救。能察觉细微是明，守住柔和是强；运用智慧还要回归内在明澈，避免给自身带来祸患。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：天下有共同的根源，可称为万物之母；认识根源后便能理解万物，理解万物后仍守住根源，终身便不致危险。收敛感官欲望、减少纷扰，可以免于劳困；不断开启欲望、增加事务，则难以挽救。能察觉细微是明，守住柔和是强；运用智慧还要回归内在明澈，避免给自身带来祸患。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 53
    section: 德经
    title: 介然有之
    original_text: "使我介然有知，行于大道，唯迤是畏。大道甚夷，而人好径。朝甚除，田甚芜，仓甚虚。服文彩，带利剑，厌饮食，财货有余，是为盗夸。非道也哉！"
    plain_explanation: "如果我稍有见识，走在大道上，最担心的就是偏离正道。大道本来平坦，人却偏爱捷径。统治者居所修饰华美，田地荒芜、粮仓空虚，自己穿锦衣、佩利剑、吃喝过度、财货有余，这种奢侈掠夺并非合道。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。如果我稍有见识，走在大道上，最担心的就是偏离正道。大道本来平坦，人却偏爱捷径。统治者居所修饰华美，田地荒芜、粮仓空虚，自己穿锦衣、佩利剑、吃喝过度、财货有余，这种奢侈掠夺并非合道。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：如果我稍有见识，走在大道上，最担心的就是偏离正道。大道本来平坦，人却偏爱捷径。统治者居所修饰华美，田地荒芜、粮仓空虚，自己穿锦衣、佩利剑、吃喝过度、财货有余，这种奢侈掠夺并非合道。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 54
    section: 德经
    title: 善建不拔
    original_text: "善建者不拔，善抱者不脱，子孙以祭祀不辍。修之于身，其德乃真；修之于家，其德乃余；修之于乡，其德乃长；修之于邦，其德乃丰；修之于天下，其德乃普。故以身观身，以家观家，以乡观乡，以邦观邦，以天下观天下。吾何以知天下然哉？以此。"
    plain_explanation: "根基建立得好便难以拔除，守持得好便不易脱落，后代也能延续祭祀。把德行落实在自身、家庭、乡里、国家和天下，影响会逐层扩展。观察个人、家庭、乡里和国家的情况，就能推知天下；这是老子认识世事的方法。"
