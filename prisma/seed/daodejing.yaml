  - number: 19
    section: 道经
    title: 绝圣弃智
    original_text: "绝圣弃智，民利百倍；绝仁弃义，民复孝慈；绝巧弃利，盗贼无有。此三者以为文不足，故令有所属；见素抱朴，少私寡欲，绝学无忧。"
    plain_explanation: "老子反对把聪明、仁义和技巧变成争名逐利的装饰，认为回归朴素能减少社会纷争。若只靠口号还不够，就要让生活有所归依：显露本真、保持朴实、减少私心和欲望。这里的“绝学”可理解为放下矫饰机巧之学，并非拒绝一切学习。"
