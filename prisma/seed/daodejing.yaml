    section: 德经
    title: 反者道动
    original_text: "反者，道之动；弱者，道之用。天下万物生于有，有生于无。"
    plain_explanation: "返回和转化是道的运动方式，柔弱是道发挥作用的方式。天下万物从具体的“有”中显现，而“有”又根源于无形无名的“无”。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。返回和转化是道的运动方式，柔弱是道发挥作用的方式。天下万物从具体的“有”中显现，而“有”又根源于无形无名的“无”。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：返回和转化是道的运动方式，柔弱是道发挥作用的方式。天下万物从具体的“有”中显现，而“有”又根源于无形无名的“无”。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 41
    section: 德经
    title: 上士闻道
    original_text: "上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之，不笑不足以为道。故《建言》有之：明道若昧，进道若退，夷道若颣。上德若谷、大白若辱；广德若不足，建德若偷、质真若渝；大方无隅、大器晚成；大音希声，大象无形，道隐无名。夫唯道，善贷且成。"
    plain_explanation: "上等的人听到道便努力实践，中等的人半信半疑，下等的人则大笑；若不被讥笑，反显不出道的反常识。道常呈现似暗、似退、似不平的样子；真正宏大的德、方正、器物、声音和形象，并不总符合表面期待。道隐而无名，却善于成就万物。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。上等的人听到道便努力实践，中等的人半信半疑，下等的人则大笑；若不被讥笑，反显不出道的反常识。道常呈现似暗、似退、似不平的样子；真正宏大的德、方正、器物、声音和形象，并不总符合表面期待。道隐而无名，却善于成就万物。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：上等的人听到道便努力实践，中等的人半信半疑，下等的人则大笑；若不被讥笑，反显不出道的反常识。道常呈现似暗、似退、似不平的样子；真正宏大的德、方正、器物、声音和形象，并不总符合表面期待。道隐而无名，却善于成就万物。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 42
    section: 德经
    title: 三生万物
    original_text: "道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤寡不穀，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。"
    plain_explanation: "老子用“一、二、三”描述道化生万物的过程；万物背阴向阳，阴阳之气交融而形成和谐。人们厌恶孤、寡、不善等称呼，王公却用它自称，说明低下有时反成根基。事物可能因减损而获益，也可能因增益而受损；逞强霸道者往往不得善终，应引以为戒。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。老子用“一、二、三”描述道化生万物的过程；万物背阴向阳，阴阳之气交融而形成和谐。人们厌恶孤、寡、不善等称呼，王公却用它自称，说明低下有时反成根基。事物可能因减损而获益，也可能因增益而受损；逞强霸道者往往不得善终，应引以为戒。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：老子用“一、二、三”描述道化生万物的过程；万物背阴向阳，阴阳之气交融而形成和谐。人们厌恶孤、寡、不善等称呼，王公却用它自称，说明低下有时反成根基。事物可能因减损而获益，也可能因增益而受损；逞强霸道者往往不得善终，应引以为戒。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 43
    section: 德经
    title: 天下至柔
    original_text: "天下之至柔，驰骋天下之至坚，无有入无间。吾是以知无为之有益。不言之教，无为之益，天下希及之。"
    plain_explanation: "天下最柔软的东西能够穿行于最坚硬之物之间，无形无物也能进入没有空隙之处。由此可见无为的益处；不靠言说的教化和不强作的效果，很少有人能做到。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：天下最柔软的东西能够穿行于最坚硬之物之间，无形无物也能进入没有空隙之处。由此可见无为的益处；不靠言说的教化和不强作的效果，很少有人能做到。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：天下最柔软的东西能够穿行于最坚硬之物之间，无形无物也能进入没有空隙之处。由此可见无为的益处；不靠言说的教化和不强作的效果，很少有人能做到。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 44
    section: 德经
    title: 知足不辱
    original_text: "名与身孰亲？身与货孰多？得与亡孰病？是故，甚爱必大费，多藏必厚亡。知足不辱，知止不殆，可以长久。"
    plain_explanation: "名声和生命哪个更亲近？生命和财物哪个更重要？得到和失去哪一种更有害？过度贪爱会付出巨大代价，收藏过多也会招致更大损失。懂得满足就少受屈辱，懂得适可而止便不危险，因而可以长久。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。名声和生命哪个更亲近？生命和财物哪个更重要？得到和失去哪一种更有害？过度贪爱会付出巨大代价，收藏过多也会招致更大损失。懂得满足就少受屈辱，懂得适可而止便不危险，因而可以长久。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：名声和生命哪个更亲近？生命和财物哪个更重要？得到和失去哪一种更有害？过度贪爱会付出巨大代价，收藏过多也会招致更大损失。懂得满足就少受屈辱，懂得适可而止便不危险，因而可以长久。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 45
    section: 德经
    title: 大成若缺
    original_text: "大成若缺，其用不弊；大盈若冲，其用不穷；大直若屈，大巧若拙，大辩若讷。躁胜寒，静胜热，清静为天下正。"
    plain_explanation: "真正圆满看似仍有缺口，反而经久耐用；真正充盈看似空虚，作用却无穷。至直显得委曲，至巧看似笨拙，善辩者看似迟钝。躁动可以抵御寒冷，宁静可以消解燥热，清静是治理天下的正道。"
