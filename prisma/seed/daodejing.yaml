  - number: 27
    section: 道经
    title: 善行无辙
    original_text: "善行无辙迹；善言无瑕谪；善数不用筹策；善闭无关楗而不可开；善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物；是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。"
    plain_explanation: "真正高明的行动、言说、计算、关闭和联结，不留下粗浅痕迹，却能有效完成。圣人善于帮助人和物，因此不轻易抛弃任何人或事物。善人可作不善者的老师，不善者也能成为善人的借鉴；若不尊重老师、不珍惜借鉴，即使自以为聪明也会迷失。"
