    section: 德经
    title: 千里之行
    original_text: "其安易持，其未兆易谋；其脆易泮，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。为者败之，执者失之。是以圣人无为故无败，无执故无失。民之从事，常于几成而败之。慎终如始，则无败事。是以圣人欲不欲，不贵难得之货。学不学，复众人之所过。以辅万物之自然，而不敢为。"
    plain_explanation: "局势安稳时容易维持，问题尚未显现时容易谋划，脆弱细微时容易处理。要在事情未发生前准备，在混乱未形成前治理；大树、高台和千里路都从细小处开始。强行作为、执着把持容易失败，许多事也常在将成时功亏一篑；慎重如初便能减少失败。圣人不贪求众人所欲，不看重稀有财物，借鉴众人忽略之处，辅助万物自然发展而不强作。"
