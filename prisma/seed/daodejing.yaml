  - number: 37
    section: 道经
    title: 道常无为
    original_text: "道常无为而无不为。侯王若能守之，万物将自化；化而欲作，吾将镇之以无名之朴；镇之以无名之朴，夫亦将无欲；不欲以静，天下将自正。"
