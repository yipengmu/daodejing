  - number: 50
    section: 德经
    title: 出生入死
    original_text: "出生入死。生之徒十有三，死之徒十有三。人之生动之于死地，亦十有三。夫何故？以其生生之厚。盖闻善摄生者，陆行不遇兕虎，入军不被甲兵。兕无所投其角，虎无所措其爪，兵无所容其刃。夫何故？以其无死地。"
    plain_explanation: "人从出生走向死亡，篇中以古代的比例说生存、死亡以及因过度求生而走向危险的人各占一部分。为什么有人把自己推向死地？因为过分厚待、执着生命。善于养护生命的人不轻易陷入危险境地，因此犀牛、猛虎和兵刃都无从伤害。"
