  - number: 76
    section: 德经
    title: 人生柔弱
    original_text: "人之生也柔弱，其死也坚强。草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。是以兵强则灭，木强则折。强大处下，柔弱处上。"
    plain_explanation: "人活着时身体柔软，死后僵硬；草木生长时柔嫩，枯死后干硬。因此坚硬强横往往趋向死亡，柔弱灵活反而属于生机。军队逞强会覆灭，树木长得过硬会折断；强大者容易处于衰败一方，柔弱者反能保有生机。"
