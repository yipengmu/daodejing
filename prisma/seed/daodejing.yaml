    section: 道经
    title: 孔德之容
    original_text: "孔德之容，惟道是从。道之为物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物。窈兮冥兮，其中有精；其精甚真，其中有信。自今及古，其名不去，以阅众甫。吾何以知众甫之状哉？以此。"
    plain_explanation: "深厚的德源自道。道虽恍惚难见，其中却包含形象、实物和精微真实的生机；这种生机可信而持久。从古到今，道一直是万物生成的依据，因此老子由此认识万物的根源。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。深厚的德源自道。道虽恍惚难见，其中却包含形象、实物和精微真实的生机；这种生机可信而持久。从古到今，道一直是万物生成的依据，因此老子由此认识万物的根源。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：深厚的德源自道。道虽恍惚难见，其中却包含形象、实物和精微真实的生机；这种生机可信而持久。从古到今，道一直是万物生成的依据，因此老子由此认识万物的根源。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 22
    section: 道经
    title: 圣人抱一
    original_text: "曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见故明；不自是故彰；不自伐故有功；不自矜故长。夫唯不争，故天下莫能与之争。古之所谓“曲则全”者，岂虚言哉？诚全而归之。"
    plain_explanation: "懂得弯曲才能保全，愿居低处才能充实，旧去才能更新，少取反而有所得，贪多则迷惑。圣人守住这个原则，不自我炫耀、不自以为是、不夸功、不自矜，所以反而明达、彰显、成事并长久。不争的人，也就没有人能与他争。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。懂得弯曲才能保全，愿居低处才能充实，旧去才能更新，少取反而有所得，贪多则迷惑。圣人守住这个原则，不自我炫耀、不自以为是、不夸功、不自矜，所以反而明达、彰显、成事并长久。不争的人，也就没有人能与他争。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：懂得弯曲才能保全，愿居低处才能充实，旧去才能更新，少取反而有所得，贪多则迷惑。圣人守住这个原则，不自我炫耀、不自以为是、不夸功、不自矜，所以反而明达、彰显、成事并长久。不争的人，也就没有人能与他争。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 23
    section: 道经
    title: 希言自然
    original_text: "希言自然。飘风不终朝，骤雨不终日。孰为此者？天地。天地尚不能久，而况于人乎？故从事于道者，同于道；德者，同于德；失者，同于失。同于道者，道亦乐得之；同于德者，德亦乐得之；同于失者，失亦乐得之。信不足焉，有不信焉。"
    plain_explanation: "少发号施令更合乎自然。狂风不会吹一整个早晨，暴雨也不会下整整一天，天地造成的激烈状态尚且不能持久，人的强作更不可能长久。人选择与道、德或失相应的道路，也会进入相应结果；缺乏诚信，就会招来不信任。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：少发号施令更合乎自然。狂风不会吹一整个早晨，暴雨也不会下整整一天，天地造成的激烈状态尚且不能持久，人的强作更不可能长久。人选择与道、德或失相应的道路，也会进入相应结果；缺乏诚信，就会招来不信任。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：少发号施令更合乎自然。狂风不会吹一整个早晨，暴雨也不会下整整一天，天地造成的激烈状态尚且不能持久，人的强作更不可能长久。人选择与道、德或失相应的道路，也会进入相应结果；缺乏诚信，就会招来不信任。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 24
    section: 道经
    title: 跨者不行
    original_text: "企者不立，跨者不行；自见者不明，自是者不彰；自伐者无功，自矜者不长；其在道也。曰：余食赘形。物或恶之，故有道者不处。"
    plain_explanation: "踮脚站不稳，跨大步走不远；自我炫示反而不明，自以为是反而不彰，夸功和自矜也难以长久。这些做法违背道，就像多余的食物和附赘的形体，人们会厌弃，得道者不会停留其中。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。踮脚站不稳，跨大步走不远；自我炫示反而不明，自以为是反而不彰，夸功和自矜也难以长久。这些做法违背道，就像多余的食物和附赘的形体，人们会厌弃，得道者不会停留其中。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：踮脚站不稳，跨大步走不远；自我炫示反而不明，自以为是反而不彰，夸功和自矜也难以长久。这些做法违背道，就像多余的食物和附赘的形体，人们会厌弃，得道者不会停留其中。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 25
    section: 道经
    title: 道法自然
    original_text: "有物混成，先天地生。寂兮寥兮，独立而不改，周行而不殆，可以为天地母。吾不知其名，强字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，人亦大。域中有四大，而人居其一焉。人法地，地法天，天法道，道法自然。"
    plain_explanation: "有一种浑然一体的存在先于天地，寂静辽阔、独立不变而循环运行，可以看作天地的根源。老子勉强称它为“道”或“大”；道运行而远行，最终又返回。人、地、天、道各有其大，人应效法地，地效法天，天效法道，而道依循万物本来的样子。"
