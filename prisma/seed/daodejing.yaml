  - number: 65
    section: 德经
    title: 玄德大顺
    original_text: "古之善为道者，非以明民，将以愚之。民之难治，以其智多。故以智治国，国之贼；不以智治国，国之福。知此两者，亦楷式。常知楷式，是谓玄德。玄德深矣、远矣、与物反矣，然后乃至大顺。"
    plain_explanation: "古代善于治道的人，不用机巧去操控百姓，而使社会保持朴素。百姓难治理，常因机智算计太多；以权术治国会伤害国家，不以权术治国才是福。理解这两种方式并以之为准则，就是深远的德；它看似与世俗习惯相反，最终却能达到大顺。"
