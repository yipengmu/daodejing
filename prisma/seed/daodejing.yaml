  - number: 38
    section: 德经
    title: 上德不德
    original_text: "上德不德，是以有德；下德不失德，是以无德。上德无为而无以为，下德无为而有以为。上仁为之而无以为，上义为之而有以为。上礼为之而莫之应，则攘臂而扔之。故失道而后德，失德而后仁，失仁而后义，失义而后礼。夫礼者，忠信之薄，而乱之首。前识者，道之华而愚之始。是以大丈夫处其厚，不居其薄；处其实，不居其华。故去彼取此。"
    plain_explanation: "最高的德不刻意表现为德，因此真有德；较低的德执着于不失德，反而失去德。仁、义、礼逐层成为外在规范，若礼仪得不到回应还强迫别人遵循，便显出诚信与秩序已衰。大丈夫守厚实而不逐浮薄，重真实而不尚虚华。"
