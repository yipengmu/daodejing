  - number: 75
    section: 德经
    title: 求生之厚
    original_text: "民之饥，以其上食税之多，是以饥。民之难治，以其上之有为，是以难治。民之轻死，以其上求生之厚，是以轻死。夫唯无以生为者，是贤于贵生。"
    plain_explanation: "百姓饥饿，是因为统治者征税过重；难以治理，是因为统治者干预太多；轻视死亡，是因为统治者自己过度追求丰厚生活。少以个人享受为目的的人，胜过一味把自身生命和享乐看得贵重的人。"
