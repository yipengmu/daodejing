  - number: 57
    section: 德经
    title: 以正治国
    original_text: "以正治国，以奇用兵，以无事取天下。吾何以知其然哉？以此。天下多忌讳，而民弥贫；人多利器，国家滋昏；人多伎巧，奇物滋起；法令滋彰，盗贼多有。故圣人云：“我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴。”"
    plain_explanation: "治国要持正，用兵可出奇，治理天下则以少扰民为要。禁令过多会使百姓困窘，武器和机巧泛滥会让社会混乱，法令越繁密，违法者反而越多。圣人因此说，少干预、好清静、少生事、少欲求，百姓便能自然变化、端正、富足而朴实。"
