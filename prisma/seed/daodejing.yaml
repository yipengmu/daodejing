  - number: 67
    section: 德经
    title: 老子三宝
    original_text: "天下皆谓我道大，似不肖。夫唯大，故似不肖。若肖，久矣其细也夫。我有三宝，持而保之。一曰慈，二曰俭，三曰不敢为天下先。慈，故能勇；俭，故能广；不敢为天下先，故能成器长。今舍慈且勇，舍俭且广，舍后且先，死矣！夫慈，以战则胜，以守则固，天将救之，以慈卫之。"
    plain_explanation: "人们说我的道很大，却不像任何具体事物；若它像某种有限之物，早就变得狭小了。老子珍视三件事：慈爱、节俭、不争先。慈爱使人勇敢，节俭使资源充裕，不争先反能成为众人的领袖。失去慈爱而求勇、失去节俭而求广、舍后争先，都会招致危险；慈爱也能使防守坚固、行动有力量。"
