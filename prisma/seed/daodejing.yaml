  - number: 30
    section: 道经
    title: 道佐人主
    original_text: "以道佐人主者，不以兵强天下。其事好还；师之所处，荆棘生焉。大军之后，必有凶年。善者果而已，不以取强。果而勿矜，果而勿伐，果而勿骄，果而不得已，果而勿强。物壮则老，是谓不道，不道早已。"
    plain_explanation: "以道辅佐君主的人，不靠战争逞强，因为武力带来的后果往往会反噬，战乱之地荒芜，大战之后常有灾荒。善于用兵者只求达成必要目标，不夸耀、不自功、不骄傲，也不继续强求。事物强盛到极点就会衰老，违背道的做法很快走向终结。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。以道辅佐君主的人，不靠战争逞强，因为武力带来的后果往往会反噬，战乱之地荒芜，大战之后常有灾荒。善于用兵者只求达成必要目标，不夸耀、不自功、不骄傲，也不继续强求。事物强盛到极点就会衰老，违背道的做法很快走向终结。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：以道辅佐君主的人，不靠战争逞强，因为武力带来的后果往往会反噬，战乱之地荒芜，大战之后常有灾荒。善于用兵者只求达成必要目标，不夸耀、不自功、不骄傲，也不继续强求。事物强盛到极点就会衰老，违背道的做法很快走向终结。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 31
    section: 道经
    title: 兵者不祥
    original_text: "夫兵者，不祥之器，物或恶之，故有道者不处。君子居则贵左，用兵则贵右。兵者，不祥之器，非君子之器；不得已而用之，恬淡为上。胜而不美，而美之者，是乐杀人。夫乐杀人者， 则不可得志于天下矣。吉事尚左，凶事尚右。偏将军居左，上将军居右，言以丧礼处之。杀人之众，以悲哀莅之；战胜，以丧礼处之。"
    plain_explanation: "武器是不祥之物，有道者不以战争为常态。迫不得已使用军队，也应保持克制淡泊，不以胜利为美；把胜利当乐事，等于以杀人为乐，无法真正赢得天下。大量人员死亡应以悲哀面对，即使战胜也要按丧礼看待。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：武器是不祥之物，有道者不以战争为常态。迫不得已使用军队，也应保持克制淡泊，不以胜利为美；把胜利当乐事，等于以杀人为乐，无法真正赢得天下。大量人员死亡应以悲哀面对，即使战胜也要按丧礼看待。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：武器是不祥之物，有道者不以战争为常态。迫不得已使用军队，也应保持克制淡泊，不以胜利为美；把胜利当乐事，等于以杀人为乐，无法真正赢得天下。大量人员死亡应以悲哀面对，即使战胜也要按丧礼看待。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 32
    section: 道经
    title: 道常无名
    original_text: "道常无名，朴虽小，天下莫能臣。侯王若能守之，万物将自宾。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦将知止，知止可以不殆。譬道之在天下，犹川谷之于江海。"
    plain_explanation: "道恒常无名，像未雕琢的朴木，看似微小却不受天下支配。君王若守道，万物自然归顺；天地交合，甘露降下，百姓无需命令也能协调。制度与名称建立后，要知道适可而止；懂得止境便不危险。道在天下，就像江海容纳众多溪谷。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。道恒常无名，像未雕琢的朴木，看似微小却不受天下支配。君王若守道，万物自然归顺；天地交合，甘露降下，百姓无需命令也能协调。制度与名称建立后，要知道适可而止；懂得止境便不危险。道在天下，就像江海容纳众多溪谷。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：道恒常无名，像未雕琢的朴木，看似微小却不受天下支配。君王若守道，万物自然归顺；天地交合，甘露降下，百姓无需命令也能协调。制度与名称建立后，要知道适可而止；懂得止境便不危险。道在天下，就像江海容纳众多溪谷。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 33
    section: 道经
    title: 知人者智
    original_text: "知人者智，自知者明；胜人者有力，自胜者强；知足者富，强行者有志；不失其所者久，死而不亡者寿。"
    plain_explanation: "了解别人是聪明，了解自己才算明达；胜过别人有力量，克服自己才是真强。懂得满足就是富有，持续践行目标就是有志气。不失根本的人能够长久，身死而精神影响仍存的人可称长寿。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。了解别人是聪明，了解自己才算明达；胜过别人有力量，克服自己才是真强。懂得满足就是富有，持续践行目标就是有志气。不失根本的人能够长久，身死而精神影响仍存的人可称长寿。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：了解别人是聪明，了解自己才算明达；胜过别人有力量，克服自己才是真强。懂得满足就是富有，持续践行目标就是有志气。不失根本的人能够长久，身死而精神影响仍存的人可称长寿。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 34
    section: 道经
    title: 大道氾兮
    original_text: "大道氾兮，其可左右。万物恃之以生而不辞，功成不有，衣养万物而不为主，可名于小。万物归焉而不为主，可名为大。以其终不自为大，故能成其大。"
    plain_explanation: "大道广泛流行，无处不在。万物依靠它生长，它不推辞，也不占有功劳；滋养万物却不做主，所以看似微小。万物归依它，它仍不主宰，所以又可称为伟大。正因从不自称伟大，才能成就其大。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。大道广泛流行，无处不在。万物依靠它生长，它不推辞，也不占有功劳；滋养万物却不做主，所以看似微小。万物归依它，它仍不主宰，所以又可称为伟大。正因从不自称伟大，才能成就其大。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
