  - number: 36
    section: 道经
    title: 欲歙故张
    original_text: "将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之，是谓微明。柔弱胜刚强。鱼不可脱于渊，国之利器不可以示人。"
    plain_explanation: "事物常会向相反方向转化：收缩之前或先扩张，削弱之前或先增强，取走之前或先给予。这是隐微的规律。柔弱能够胜过刚强。鱼不应离开深水，治理国家的关键手段也不宜轻易展示给人。"
