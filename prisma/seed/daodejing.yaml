  - number: 78
    section: 德经
    title: 天下弱水
    original_text: "天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。弱之胜强，柔之胜刚，天下莫不知，莫能行。是以圣人云：受国之垢，是谓社稷主；受国不祥，是为天下王。正言若反。"
    plain_explanation: "天下没有比水更柔弱的东西，却没有什么能胜过它对坚硬之物的冲击，因为没有东西能替代它持久的作用。柔弱胜刚强的道理人人知道，却难以实践。圣人说，能承担国家屈辱的人才配做社稷之主，能承担国家灾难的人才配做天下君王；正面的话听起来常像反话。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。天下没有比水更柔弱的东西，却没有什么能胜过它对坚硬之物的冲击，因为没有东西能替代它持久的作用。柔弱胜刚强的道理人人知道，却难以实践。圣人说，能承担国家屈辱的人才配做社稷之主，能承担国家灾难的人才配做天下君王；正面的话听起来常像反话。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：天下没有比水更柔弱的东西，却没有什么能胜过它对坚硬之物的冲击，因为没有东西能替代它持久的作用。柔弱胜刚强的道理人人知道，却难以实践。圣人说，能承担国家屈辱的人才配做社稷之主，能承担国家灾难的人才配做天下君王；正面的话听起来常像反话。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 79
    section: 德经
    title: 天道无亲
    original_text: "和大怨，必有余怨，安可以为善？是以圣人执左契，而不责于人。有德司契，无德司彻；天道无亲，常与善人。"
    plain_explanation: "即使调解了深重怨恨，也可能留下余怨，不能算真正妥善。因此圣人持有债券凭据，却不借此逼迫别人。有德者像持券人守约而不苛责，无德者则像税吏追索。天道不偏袒亲近者，却常与行善守德的人相应。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：即使调解了深重怨恨，也可能留下余怨，不能算真正妥善。因此圣人持有债券凭据，却不借此逼迫别人。有德者像持券人守约而不苛责，无德者则像税吏追索。天道不偏袒亲近者，却常与行善守德的人相应。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：即使调解了深重怨恨，也可能留下余怨，不能算真正妥善。因此圣人持有债券凭据，却不借此逼迫别人。有德者像持券人守约而不苛责，无德者则像税吏追索。天道不偏袒亲近者，却常与行善守德的人相应。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 80
    section: 德经
    title: 小国寡民
    original_text: "小国寡民，使有什佰之器而不用，使民重死而不远徙。虽有舟舆，无所乘之；虽有甲兵，无所陈之；使人复结绳而用之。甘其食，美其服，安其居，乐其俗。邻国相望，鸡犬之声相闻，民至老死不相往来。"
    plain_explanation: "老子描绘一个规模不大、人口不多的理想社会：器具齐备却不过度使用，人们珍惜生命、不远迁；有船车却没有出行需要，有兵器却没有战争；生活简单，食物香甜、衣服舒适、居所安稳、习俗快乐。邻国相望、鸡犬相闻，百姓却可以安于本地生活直到老去。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。老子描绘一个规模不大、人口不多的理想社会：器具齐备却不过度使用，人们珍惜生命、不远迁；有船车却没有出行需要，有兵器却没有战争；生活简单，食物香甜、衣服舒适、居所安稳、习俗快乐。邻国相望、鸡犬相闻，百姓却可以安于本地生活直到老去。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：老子描绘一个规模不大、人口不多的理想社会：器具齐备却不过度使用，人们珍惜生命、不远迁；有船车却没有出行需要，有兵器却没有战争；生活简单，食物香甜、衣服舒适、居所安稳、习俗快乐。邻国相望、鸡犬相闻，百姓却可以安于本地生活直到老去。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 81
    section: 德经
    title: 圣人之道
    original_text: "信言不美，美言不信；善者不辩，辩者不善；知者不博，博者不知。圣人不积，既以为人，己愈有；既以与人，己愈多。天之道，利而不害。圣人之道，为而不争。"
    plain_explanation: "真实的话未必动听，动听的话未必真实；善良的人不靠争辩取胜，善辩的人未必真善；有真知的人不以知识繁多自夸，知识炫博者未必真懂。圣人不积攒占有，越帮助别人自身越充实，越给予别人自己反而越丰富。天道有益万物而不伤害，圣人做事而不争功。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。真实的话未必动听，动听的话未必真实；善良的人不靠争辩取胜，善辩的人未必真善；有真知的人不以知识繁多自夸，知识炫博者未必真懂。圣人不积攒占有，越帮助别人自身越充实，越给予别人自己反而越丰富。天道有益万物而不伤害，圣人做事而不争功。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：真实的话未必动听，动听的话未必真实；善良的人不靠争辩取胜，善辩的人未必真善；有真知的人不以知识繁多自夸，知识炫博者未必真懂。圣人不积攒占有，越帮助别人自身越充实，越给予别人自己反而越丰富。天道有益万物而不伤害，圣人做事而不争功。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
