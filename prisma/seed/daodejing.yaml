  - number: 73
    section: 德经
    title: 天网恢恢
    original_text: "勇于敢则杀，勇于不敢则活。此两者，或利或害。天之所恶，孰知其故？是以圣人犹难之。天之道，不争而善胜，不言而善应，不召而自来，繟然而善谋。天网恢恢，疏而不失。"
    plain_explanation: "一味逞强冒进可能招致死亡，懂得克制、不轻举妄动则可能保全；两种勇气带来不同结果。天道的规律难以完全测知，圣人也谨慎对待。天道不争却善于取胜，不言却有回应，不召而万物自至，从容运作而安排周全；天道广阔，虽疏朗却不会遗漏。"
