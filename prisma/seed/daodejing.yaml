  - number: 17
    section: 道经
    title: 悠兮贵言
    original_text: "太上，下知有之；其次，亲而誉之；其次，畏之；其次，侮之。信不足焉，有不信焉；悠兮其贵言；功成事遂，百姓皆谓：我自然。"
