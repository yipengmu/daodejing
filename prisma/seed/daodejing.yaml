  - number: 16
    section: 道经
    title: 虚极守静
    original_text: "致虚极，守静笃；万物并作，吾以观其复。夫物芸芸，各归其根；归根曰静，静曰复命；复命曰常，知常曰明，不知常妄作凶。知常容、容乃公、公乃全、全乃天、天乃道、道乃久、没身不殆。"
    plain_explanation: "让内心空明到极处，坚定守住宁静，便能观察万物繁盛之后各自返回根本。归根是静，静是回到本性；认识这种恒常规律就是明智。知常使人宽容，宽容而公正，最终与天道相合，终身少有危险。"
