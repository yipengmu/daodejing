  - number: 77
    section: 德经
    title: 天道张弓
    original_text: "天之道，其犹张弓乎！高者抑之，下者举之；有余者损之，不足者补之。天之道，损有余而补不足。人之道则不然，损不足以奉有余。孰能有余以奉天下？唯有道者。是以圣人为而不恃，功成而不处，其不欲见贤。"
    plain_explanation: "天道像拉弓：高处压低，低处抬高；有余者减损，不足者补充。天道会平衡盈亏，而世俗做法常从不足者那里拿去，供给有余者。谁能把自己的有余拿来供给天下？只有合道者。圣人有所作为却不依恃，功成却不居功，也不刻意显示贤能。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。天道像拉弓：高处压低，低处抬高；有余者减损，不足者补充。天道会平衡盈亏，而世俗做法常从不足者那里拿去，供给有余者。谁能把自己的有余拿来供给天下？只有合道者。圣人有所作为却不依恃，功成却不居功，也不刻意显示贤能。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
