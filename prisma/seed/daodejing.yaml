  - number: 47
    section: 德经
    title: 不为而成
    original_text: "不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。是以圣人不行而知，不见而明，不为而成。"
    plain_explanation: "不出门也能认识天下，不向窗外张望也能体察规律；走得越远，若只靠外在见闻，反可能知道得越少。圣人通过内在体察把握规律，不必事事亲历，也能明白并促成事情。"
