  - number: 59
    section: 德经
    title: 治人事天
    original_text: "治人事天，莫若啬。夫唯啬，是谓早服。早服谓之重积德，重积德则无不克，无不克则莫知其极，莫知其极，可以有国。有国之母，可以长久。是谓深根固柢，长生久视之道。"
    plain_explanation: "治理百姓、顺应天道，最重要的是节制和珍惜力量。及早节制就是及早有所准备，长期积累德行便能克服困难，力量深厚而不可估量，才足以治理国家。守住国家的根本，才能长久，这就是根深蒂固、长治久安之道。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：治理百姓、顺应天道，最重要的是节制和珍惜力量。及早节制就是及早有所准备，长期积累德行便能克服困难，力量深厚而不可估量，才足以治理国家。守住国家的根本，才能长久，这就是根深蒂固、长治久安之道。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：治理百姓、顺应天道，最重要的是节制和珍惜力量。及早节制就是及早有所准备，长期积累德行便能克服困难，力量深厚而不可估量，才足以治理国家。守住国家的根本，才能长久，这就是根深蒂固、长治久安之道。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 60
    section: 德经
    title: 道莅天下
    original_text: "治大国，若烹小鲜。以道莅天下，其鬼不神；非其鬼不神，其神不伤人；非其神不伤人，圣人亦不伤人。夫两不相伤，故德交归焉。"
    plain_explanation: "治理大国像煎小鱼，不宜频繁翻动。以道治理天下，鬼神即使有灵也不伤人；不只是鬼神不伤人，圣人也不伤人。各方都不相互损害，德便会汇聚于天下。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。治理大国像煎小鱼，不宜频繁翻动。以道治理天下，鬼神即使有灵也不伤人；不只是鬼神不伤人，圣人也不伤人。各方都不相互损害，德便会汇聚于天下。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：治理大国像煎小鱼，不宜频繁翻动。以道治理天下，鬼神即使有灵也不伤人；不只是鬼神不伤人，圣人也不伤人。各方都不相互损害，德便会汇聚于天下。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 61
    section: 德经
    title: 大国下流
    original_text: "大国者下流。天下之交，天下之牝。牝常以静胜牡，以静为下。故大国以下小国，则取小国；小国以下大国，则取大国。故或下以取，或下而取。大国不过欲兼畜人，小国不过欲入事人，夫两者各得其所欲，大者宜为下。"
    plain_explanation: "大国应像江河下游一样居低处，是天下交汇、柔静包容之处。柔静常以谦下胜过刚强。因此大国谦下可以赢得小国，小国谦下也能得到大国接纳。双方都能实现愿望，而大国尤其应该谦下。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。大国应像江河下游一样居低处，是天下交汇、柔静包容之处。柔静常以谦下胜过刚强。因此大国谦下可以赢得小国，小国谦下也能得到大国接纳。双方都能实现愿望，而大国尤其应该谦下。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：大国应像江河下游一样居低处，是天下交汇、柔静包容之处。柔静常以谦下胜过刚强。因此大国谦下可以赢得小国，小国谦下也能得到大国接纳。双方都能实现愿望，而大国尤其应该谦下。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 62
    section: 德经
    title: 万物之奥
    original_text: "道者万物之奥，善人之宝，不善人之所保。美言可以市尊，美行可以加人。人之不善，何弃之有？故立天子，置三公，虽有拱璧以先驷马，不如坐进此道。古之所以贵此道者何？不曰以求得，有罪以免耶？故为天下贵。"
    plain_explanation: "道是万物深处的依归，是善人的珍宝，也是不善者可以凭借的保护。美好的言辞能换得尊重，美好的行为能获得他人认可；即使是不善之人，也不应被彻底抛弃。即使以贵重礼物迎接天子和三公，也不如安坐下来进献大道。古人珍贵道，因为它能帮助人求得所需，也能让有过者改过自新。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。道是万物深处的依归，是善人的珍宝，也是不善者可以凭借的保护。美好的言辞能换得尊重，美好的行为能获得他人认可；即使是不善之人，也不应被彻底抛弃。即使以贵重礼物迎接天子和三公，也不如安坐下来进献大道。古人珍贵道，因为它能帮助人求得所需，也能让有过者改过自新。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：道是万物深处的依归，是善人的珍宝，也是不善者可以凭借的保护。美好的言辞能换得尊重，美好的行为能获得他人认可；即使是不善之人，也不应被彻底抛弃。即使以贵重礼物迎接天子和三公，也不如安坐下来进献大道。古人珍贵道，因为它能帮助人求得所需，也能让有过者改过自新。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 63
    section: 德经
    title: 无为无事
    original_text: "为无为，事无事，味无味。大小多少，报怨以德。图难于其易，为大于其细。天下难事，必作于易；天下大事，必作于细。是以圣人终不为大，故能成其大。夫轻诺必寡信，多易必多难。是以圣人犹难之。故终无难矣。"
    plain_explanation: "以不妄为的态度做事，把平淡当作滋味；无论事情大小多少，都以德回应怨恨。困难要从容易处谋划，大事要从细微处着手，天下难事由易处开始，大事由小处累积。圣人不自居于做大事，反而成就大事；不轻易许诺、不轻视困难，最终便少有难题。"
