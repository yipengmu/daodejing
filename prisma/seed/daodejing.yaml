  - number: 28
    section: 道经
    title: 知雄守雌
    original_text: "知其雄，守其雌，为天下溪。为天下溪，常德不离，复归于婴儿。知其白，守其黑，为天下式。为天下式，常德不忒，复归于无极。知其荣，守其辱，为天下谷。为天下谷，常德乃足，复归于朴。朴散则为器，圣人用之，则为官长。故大制不割。"
    plain_explanation: "知道刚强却守住柔和，知道光明却不拒绝幽暗，知道荣耀却能安处卑下，便像溪谷一样容纳万物。持守这些相反两端而不偏废，德性得以完整，最终回归婴儿般纯真、无极和朴素。朴素分化成具体事物，圣人善用它们治理，因此大的制度不以割裂为代价。"
