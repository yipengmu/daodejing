chapters:
  - number: 1
    section: 道经
    title: 众妙之门
    original_text: "道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母；故常无，欲以观其妙；常有，欲以观其徼；此两者，同出而异名，同谓之玄，玄之又玄，众妙之门。"
    plain_explanation: "能够用语言说出的道，就不是恒常不变的道；能够说清的名称，也不是恒常不变的名称。未命名时可看作天地的开端，命名之后则是万物得以辨识和生长的根源。以无欲观其幽微，以有欲观其显现；两者同源而名称不同，都深远难测，是理解万物奥妙的入口。"
    youth_easy_read: "我们常想给人生找一个标准答案：怎样才算成功、选哪条路才对。但第一章提醒我们，能被一句话或一个标签说尽的“道”，已经不是完整的生活本身。求职、升职、转行、建立关系，都可以用目标帮助自己行动，却别把暂时的职位、收入或评价当成自我全部。先放下急着证明自己的心，比较容易看见事情的细微可能；认真观察现实，又能看见它实际的边界。"
    heshanggong_interpretation: "河上公把“道”解释为自然常道，认为无名之道是天地本始，有名的天地含气化生万物；无欲可观道的要妙，有欲可观察万物的归趋。此说兼重治身与治国，劝人守无为、安静，不以富贵声名扰乱本性。"
  - number: 2
    section: 道经
    title: 有无相生
    original_text: "天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随；恒也。是以圣人处无为之事，行不言之教。万物作而弗辞，生而不有，为而不恃，功成而弗居。夫唯弗居，是以不去。"
    plain_explanation: "人们一旦把某物固定称为美，丑的概念也随之出现；善恶以及有无、难易、高下等，都在相互比较中成立。明白这种相待关系，圣人便以不强作的方式做事，以身教代替繁复说教；让万物生长而不占有，做成事情而不自恃，不把功劳据为己有，因此功业反而能够长存。"
    youth_easy_read: "在学校、求职和职场里，我们很容易用排名、薪资、头衔判断谁更优秀；但比较一出现，焦虑也跟着出现。第二章不是叫人放弃进步，而是提醒：别让外界标签决定自己的价值。团队合作时，做好该做的事、给别人发挥空间，成果不必全揽在自己名下。这样的做法看似不抢功，长期却更容易建立信任，也让合作成果留下来。"
    heshanggong_interpretation: "河上公认为美恶、善不善等名目由人为分别而显；圣人治理应顺自然、不多施为，以不言之教使民自化。万物生长而圣人不占有，功成而不居功，才能使德长久不失。"
  - number: 3
    section: 道经
    title: 无知无欲
    original_text: "不尚贤，使民不争；不贵难得之货，使民不为盗；不见可欲，使民心不乱。是以圣人之治也，虚其心，实其腹，弱其志，强其骨。常使民无知无欲。使夫智者不敢为也。为无为，则无不治。"
    plain_explanation: "不刻意抬高贤能、不炒作稀有财物、不刺激贪欲，可以减少争夺和混乱。圣人治理时使人内心少受欲望牵引，生活得到满足，身体有力量。这里的无为不是不做事，而是不以机巧和过度干预操控百姓；如此反能使社会自然安定。"
    youth_easy_read: "社交媒体把名校、名企、升职和消费品不断摆在眼前，人很容易觉得自己落后，然后为了被认可而争抢。第三章可以提醒我们：少盯着稀缺标签，不等于不努力，而是把注意力放回真实需要——睡眠、健康、基本生活、可靠技能和踏实练习。带团队或参与社群时，也少用攀比和奖励制造焦虑，让人有条件把事情做好。"
    heshanggong_interpretation: "河上公把本章看作安民之道：少显耀贤名与珍货，减少争夺和盗心；治理者应虚心、养民、强其筋骨，使人守真而少欲。这里的“无知”主要指不被机巧欲念牵引，终归以无为使天下自安。"
  - number: 4
    section: 道经
    title: 万物之宗
    original_text: "道冲，而用之或不盈。渊兮似万物之宗；挫其锐，解其纷；和其光，同其尘；湛兮似或存。吾不知其谁之子，象帝之先。"
    plain_explanation: "道空虚无形，使用起来却似乎永不穷尽，深远得像万物的源头。它收敛锋芒、化解纷扰，不炫耀光亮而与尘世相融，幽深之中仿佛一直存在。老子说自己不知道道从何而来，只能推想它早于天帝。"
    youth_easy_read: "当你暂时不知道未来要走哪条路，不必急着把空白填满。像一个有弹性的空间，能让新想法和新关系慢慢长出来。遇到冲突时先收一收锋芒、把复杂问题拆开；有能力也不必时时展示。真正可靠的底气，常常不是声量最大，而是能容纳变化、持续做事。"
    heshanggong_interpretation: "河上公以“道冲”说明道体虚无而用之不穷，能包容万物、挫锐解纷、和光同尘。道深远难名，似有若无，是天地万物所由出的根本；因此修身治国都应取法其谦虚不争。"
  - number: 5
    section: 道经
    title: 天地不仁
    original_text: "天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。天地之间，其犹橐龠乎？虚而不屈，动而愈出。多言数穷，不如守中。"
    plain_explanation: "天地不按人的好恶偏爱万物，圣人也不以私情偏袒百姓；刍狗在祭祀时被使用，仪式结束后便放下，这里强调的是不带私心的对待。天地像风箱，空虚却不枯竭，越运作越有生机。言辞过多容易走到尽头，不如守住虚静平衡。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。天地不按人的好恶偏爱万物，圣人也不以私情偏袒百姓；刍狗在祭祀时被使用，仪式结束后便放下，这里强调的是不带私心的对待。天地像风箱，空虚却不枯竭，越运作越有生机。言辞过多容易走到尽头，不如守住虚静平衡。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：天地不按人的好恶偏爱万物，圣人也不以私情偏袒百姓；刍狗在祭祀时被使用，仪式结束后便放下，这里强调的是不带私心的对待。天地像风箱，空虚却不枯竭，越运作越有生机。言辞过多容易走到尽头，不如守住虚静平衡。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 6
    section: 道经
    title: 玄牝之门
    original_text: "谷神不死，是谓玄牝。玄牝之门，是谓天地根。绵绵若存，用之不勤。"
    plain_explanation: "山谷般虚静而能生养的力量，称为玄牝；它的门户就是天地万物的根源。这种生机绵延不断，似有若无，取用它也不会耗尽。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。山谷般虚静而能生养的力量，称为玄牝；它的门户就是天地万物的根源。这种生机绵延不断，似有若无，取用它也不会耗尽。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：山谷般虚静而能生养的力量，称为玄牝；它的门户就是天地万物的根源。这种生机绵延不断，似有若无，取用它也不会耗尽。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 7
    section: 道经
    title: 天长地久
    original_text: "天长地久。天地所以能长且久者，以其不自生，故能长生。是以圣人后其身而身先，外其身而身存。非以其无私耶？故能成其私。"
    plain_explanation: "天地之所以长久，是因为它们不只为自身谋生，因此能够长存。圣人把自己放在后面，反而受到推重；不把自身安危放在首位，反而得以保全。正因不执着于私利，最终成就了自身。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：天地之所以长久，是因为它们不只为自身谋生，因此能够长存。圣人把自己放在后面，反而受到推重；不把自身安危放在首位，反而得以保全。正因不执着于私利，最终成就了自身。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：天地之所以长久，是因为它们不只为自身谋生，因此能够长存。圣人把自己放在后面，反而受到推重；不把自身安危放在首位，反而得以保全。正因不执着于私利，最终成就了自身。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 8
    section: 道经
    title: 上善若水
    original_text: "上善若水。水善利万物而不争，处众人之所恶，故几于道：居善地，心善渊，与善仁，言善信，政善治，事善能，动善时；夫唯不争，故无尤。"
    plain_explanation: "最高的善像水一样，滋养万物而不争，甘居人们不喜欢的低处，因此接近道。居处选择合宜，心境深静，待人仁厚，说话守信，治理有序，做事胜任，行动把握时机。因为不争，所以少有过失和怨尤。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。最高的善像水一样，滋养万物而不争，甘居人们不喜欢的低处，因此接近道。居处选择合宜，心境深静，待人仁厚，说话守信，治理有序，做事胜任，行动把握时机。因为不争，所以少有过失和怨尤。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：最高的善像水一样，滋养万物而不争，甘居人们不喜欢的低处，因此接近道。居处选择合宜，心境深静，待人仁厚，说话守信，治理有序，做事胜任，行动把握时机。因为不争，所以少有过失和怨尤。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 9
    section: 道经
    title: 功遂身退
    original_text: "持而盈之，不如其已；揣而锐之，不可长保。金玉满堂，莫之能守；富贵而骄，自遗其咎。功遂身退，天之道。"
    plain_explanation: "把器物灌到满溢，不如适可而止；磨得过分锋利，也难以长久保持。财富堆满家中难以守住，富贵后骄纵会给自己招来祸患。功业完成后懂得退让，是顺应自然的做法。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。把器物灌到满溢，不如适可而止；磨得过分锋利，也难以长久保持。财富堆满家中难以守住，富贵后骄纵会给自己招来祸患。功业完成后懂得退让，是顺应自然的做法。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：把器物灌到满溢，不如适可而止；磨得过分锋利，也难以长久保持。财富堆满家中难以守住，富贵后骄纵会给自己招来祸患。功业完成后懂得退让，是顺应自然的做法。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 10
    section: 道经
    title: 明白四达
    original_text: "载营魄抱一，能无离乎？专气致柔，能如婴儿乎？涤除玄览，能无疵乎？爱民治国，能无为乎？天门开阖，能为雌乎？明白四达，能无知乎？生之畜之；生而不有；为而不恃；长而不宰；是谓玄德。"
    plain_explanation: "这一章以一连串自问勉励人身心合一、专气致柔、洗净心灵、治理时少私少扰，并保持柔和谦下。即使通达明察，也不炫耀机智。让万物生长、养育它们，却不占有、不自恃、不支配，这就是深远的德。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。这一章以一连串自问勉励人身心合一、专气致柔、洗净心灵、治理时少私少扰，并保持柔和谦下。即使通达明察，也不炫耀机智。让万物生长、养育它们，却不占有、不自恃、不支配，这就是深远的德。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：这一章以一连串自问勉励人身心合一、专气致柔、洗净心灵、治理时少私少扰，并保持柔和谦下。即使通达明察，也不炫耀机智。让万物生长、养育它们，却不占有、不自恃、不支配，这就是深远的德。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 11
    section: 道经
    title: 无以为用
    original_text: "三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。"
    plain_explanation: "车轮的辐条、陶器的泥土、房屋的墙壁都属于“有”，但车毂的空处、器皿的内部、房间的空间，才让它们真正发挥用途。因此实体带来便利，空处提供实际功能。"
    youth_easy_read: "这段话也能放进工作与人生转折中读：车轮的辐条、陶器的泥土、房屋的墙壁都属于“有”，但车毂的空处、器皿的内部、房间的空间，才让它们真正发挥用途。因此实体带来便利，空处提供实际功能。。它不是要求你放弃目标，而是提醒目标之外还要看代价、时机与他人处境。可以把经意转成一个实践：减少一项无效消耗，留出空间复盘，再继续推进真正重要的事。"
    heshanggong_interpretation: "河上公章句多把道落实为养身安民之法。本章的要点可概括为：车轮的辐条、陶器的泥土、房屋的墙壁都属于“有”，但车毂的空处、器皿的内部、房间的空间，才让它们真正发挥用途。因此实体带来便利，空处提供实际功能。。从个人看，是守住内在根本、避免欲望与躁作耗损；从治理看，是以少扰、谦下和顺应自然来维持秩序。这里是对古注脉络的白话概述，不是古注原文。"
  - number: 12
    section: 道经
    title: 五色五味
    original_text: "五色令人目盲；五音令人耳聋；五味令人口爽；驰骋畋猎，令人心发狂；难得之货，令人行妨。是以圣人为腹不为目，故去彼取此。"
    plain_explanation: "过度追逐鲜艳色彩、繁杂音乐、浓烈滋味、狩猎刺激和稀有财物，会使感官与心志受扰。圣人重视真实生活所需，而不沉迷外在刺激，所以舍弃诱惑，选择内在满足。"
    youth_easy_read: "无论处在求学、初入职场、承担责任或人生转向阶段，都可以借这章检查自己的做法。过度追逐鲜艳色彩、繁杂音乐、浓烈滋味、狩猎刺激和稀有财物，会使感官与心志受扰。圣人重视真实生活所需，而不沉迷外在刺激，所以舍弃诱惑，选择内在满足。如果把它用在现实中，重点不是照搬古代制度，而是在自己的处境里练习克制、观察和承担，并和可信任的人讨论不同选择的后果。"
    heshanggong_interpretation: "按河上公章句的解经取向，本章可以从“修身”和“治国”两层读：过度追逐鲜艳色彩、繁杂音乐、浓烈滋味、狩猎刺激和稀有财物，会使感官与心志受扰。圣人重视真实生活所需，而不沉迷外在刺激，所以舍弃诱惑，选择内在满足。。个人修养侧重守真、养气、减少贪求；政治层面侧重安民、节制政令、不以权力妄为。此处为现代释义，具体词句仍应回看古注原文。"
  - number: 13
    section: 道经
    title: 宠辱若惊
    original_text: "宠辱若惊，贵大患若身。何谓宠辱若惊？宠为上，辱为下;得之若惊，失之若惊，是谓宠辱若惊。何谓贵大患若身？吾所以有大患者，为吾有身，及吾无身，吾有何患？故贵以身为天下，若可寄天下；爱以身为天下，若可托天下。"
    plain_explanation: "受宠和受辱都令人不安，因为人把外界评价看得很重。最大的忧患也与过度执着自身有关；若不把自我得失看得绝对，忧患便无从依附。能够像珍惜自身一样谨慎对待天下的人，才可以把天下托付给他。"
    youth_easy_read: "放到人生阶段里看：学习和职业选择常有不确定性，先把这章当作调整行动方式的提醒，而不是成功公式。受宠和受辱都令人不安，因为人把外界评价看得很重。最大的忧患也与过度执着自身有关；若不把自我得失看得绝对，忧患便无从依附。能够像珍惜自身一样谨慎对待天下的人，才可以把天下托付给他。可以落在一个具体练习上：把注意力放回今天能做的一步，观察它对自己和身边人的真实影响，再决定下一步。"
    heshanggong_interpretation: "河上公章句常从治身与治国两面阐释经文。本章可按这一传统理解为：受宠和受辱都令人不安，因为人把外界评价看得很重。最大的忧患也与过度执着自身有关；若不把自我得失看得绝对，忧患便无从依附。能够像珍惜自身一样谨慎对待天下的人，才可以把天下托付给他。。落实到治身，是收敛妄念、顺应本性；落实到治国，是减少强制与扰动，使人和万物各得其所。此为古注思路的现代转述。"
  - number: 14
    section: 道经
    title: 惚恍道纪
    original_text: "视之不见名曰夷，听之不闻名曰希，搏之不得名曰微；此三者，不可致诘，故混而为一；其上不皦，其下不昧；绳绳兮不可名，复归于无物；是谓无状之状，无物之象，是谓惚恍。迎之不见其首，随之不见其后。执古之道，以御今之有；能知古始，是谓道纪。"
    plain_explanation: "道看不见、听不到、摸不着，无法用感官分别，因而混融为一。它既不明亮也不昏暗，连续存在却难以命名，像是无形无物的形象。把握古已有之的道，便能理解当下万物的运行，这就是认识道的纲纪。"
    youth_easy_read: "对正在建立职业方向、关系和生活节奏的人来说，这章提供的是一个检视问题的角度。道看不见、听不到、摸不着，无法用感官分别，因而混融为一。它既不明亮也不昏暗，连续存在却难以命名，像是无形无物的形象。把握古已有之的道，便能理解当下万物的运行，这就是认识道的纲纪。遇到升学、换岗、合作或家庭选择时，不妨先问：我是在回应真实需要，还是被比较、焦虑和面子推着走？据此做一个小而可持续的调整。"
    heshanggong_interpretation: "依河上公注的传统视角，本章既谈个人修养，也可用于治理：道看不见、听不到、摸不着，无法用感官分别，因而混融为一。它既不明亮也不昏暗，连续存在却难以命名，像是无形无物的形象。把握古已有之的道，便能理解当下万物的运行，这就是认识道的纲纪。。古注特别重视守静、节欲、保全精神与顺时而行；转述为现代话，就是不以过度作为损伤生命和社会秩序。"
  - number: 15
    section: 道经
    title: 道者之容
    original_text: "古之善为道者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮其若冬涉川，犹兮其若畏四邻，俨兮其若客，涣兮其若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？唯有道者，保此道者不欲盈。夫唯不盈，故能蔽而新成。"
    plain_explanation: "古代得道者深微难测，只能勉强形容为谨慎、警觉、庄重、融和、朴厚、开阔，也像浑浊未分。谁能让浑浊在安静中慢慢澄清，又让安定中渐渐生发？守道者不求满盈，因此能不断更新。"
