  - number: 20
    section: 道经
    title: 唯之与阿
    original_text: "唯之与阿，相去几何？善之与恶，相去若何？人之所畏，不可不畏。荒兮，其未央哉！众人熙熙，如享太牢，如春登台；我独泊兮，其未兆，如婴儿之未孩。傫傫兮若无所归。众人皆有余，而我独若遗；我愚人之心也哉，沌沌兮！俗人昭昭，我独昏昏；众人察察，我独闷闷。澹兮其若海，飂兮若无止。众人皆有以，而我独顽似鄙。我独异于人，而贵食母。"
    plain_explanation: "应诺和呵斥、善和恶之间的差别究竟有多大？世人都追逐热闹与确定答案，老子却自述像婴儿般未定、仿佛无所归，显得混沌而迟钝。他愿意与众不同，珍重滋养万物的根源，而不随俗争逐。"
