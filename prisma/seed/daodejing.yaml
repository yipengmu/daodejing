  - number: 58
    section: 德经
    title: 其政闷闷
    original_text: "其政闷闷，其民淳淳；其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。孰知其极？其无正。正复为奇，善复为妖，人之迷，其日固久。是以圣人方而不割，廉而不刿，直而不肆，光而不耀。"
    plain_explanation: "政令宽简含蓄，百姓往往淳朴；政令苛察细密，百姓反而多有缺失。祸福相互依存、彼此转化，难以断定终点；正可能变成偏奇，善也可能转成邪恶。圣人因此端方却不伤人，锋利却不刺人，正直而不放纵，明亮而不炫耀。"
