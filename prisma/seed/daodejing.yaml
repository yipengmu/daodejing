  - number: 66
    section: 德经
    title: 百谷王者
    original_text: "江海所以能为百谷王者，以其善下之，故能为百谷王。是以圣人欲上民，必以言下之；欲先民，必以身后之。是以圣人处上而民不重，处前而民不害。是以天下乐推而不厌。以其不争，故天下莫能与之争。"
    plain_explanation: "江海之所以能汇聚百川，是因为善于处在低处。圣人若想居于百姓之上，言辞就要谦下；若想走在百姓前面，行动上就要把自己放在后面。这样居高位却不压迫人，走在前面也不妨害人，天下乐于推举他。因为不争，便无人能与他争。"
