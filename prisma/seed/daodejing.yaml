  - number: 39
    section: 德经
    title: 得一以清
    original_text: "昔之得一者。天得一以清，地得一以宁，神得一以灵，谷得一以盈，万物得一以生，侯王得一以为天下正。其致之，天无以清将恐裂，地无以宁将恐废，神无以灵将恐歇，谷无以盈将恐竭，万物无以生将恐灭，侯王无以正将恐蹶。故贵以贱为本，高以下为基。是以侯王自称孤寡不穀。此非以贱为本耶？非乎？故至誉无誉。是故不欲琭琭如玉，珞珞如石。"
    plain_explanation: "天地万物各自得到“一”，才有清明、安宁、生机和秩序；失去根本便会崩解。尊贵以卑下为根基，高位以下位为基础，因此君王也自称孤、寡、不善。最高的声誉不靠自我标榜；人不必像美玉般炫耀，也不必像石头般粗砺，关键是守住根本。"
