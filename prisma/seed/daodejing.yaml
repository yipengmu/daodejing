  - number: 55
    section: 德经
    title: 含德之厚
    original_text: "含德之厚，比于赤子。蜂虿虺蛇不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固，未知牝牡之合而朘作，精之至也。终日号而不嗄，和之至也。知和曰常，知常曰明，益生曰祥，心使气曰强。物壮则老，谓之不道，不道早已。"
    plain_explanation: "德性深厚的人像婴儿，柔弱却充满生命力，气息和谐，整日啼哭也不嘶哑。认识和谐就是懂得常道，懂得常道就是明智；刻意增加刺激、强使气力则未必吉祥。事物过度强盛便走向衰老，违背常道就会早早终结。"
