  - number: 49
    section: 德经
    title: 圣人无常
    original_text: "圣人无常心，以百姓心为心。善者，吾善之；不善者，吾亦善之，德善。信者，吾信之；不信者，吾亦信之，德信。圣人在天下，歙歙焉，为天下，浑其心。百姓皆注其耳目，圣人皆孩之。"
    plain_explanation: "圣人不固守个人成见，而以百姓的心为心；善良的人以善相待，不善的人也以善相待，使德行得以成全；守信者和暂不守信者都以诚信相待，使信任得以建立。圣人收敛私心、使心境浑朴，让百姓保持纯真。"
