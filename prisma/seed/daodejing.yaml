  - number: 46
    section: 德经
    title: 天下有道
    original_text: "天下有道，却走马以粪；天下无道，戎马生于郊。祸莫大于不知足，咎莫大于欲得；故知足之足，常足矣。"
    plain_explanation: "天下有道时，战马退下来耕田；天下无道时，军马在郊野繁殖，战争不断。最大的祸患是不知满足，最大的过失是贪求获取。懂得满足的人，常能感到充足。"
