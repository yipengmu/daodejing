  - number: 48
    section: 德经
    title: 为道日损
    original_text: "为学日益，为道日损。损之又损，以至于无为，无为而无不为。取天下常以无事，及其有事，不足以取天下。"
    plain_explanation: "求学常是日渐增加知识，体道则是逐步减去私欲、机巧和多余作为。不断减损，直到不妄为，便能让事情依其规律完成。治理天下应少扰民，事务过多、干预过度，反而无法安定天下。"
