  - number: 56
    section: 德经
    title: 知者不言
    original_text: "知者不言，言者不知。塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘，是谓玄同。故不可得而亲，不可得而疏；不可得而利，不可得而害；不可得而贵，不可得而贱，故为天下贵。"
    plain_explanation: "真正体道的人不以言辞夸示，善说的人未必真懂。收敛感官欲望，消解锋芒与纷扰，调和光彩并融入尘世，这叫深远的齐同。这样的人不被亲疏、利害、贵贱左右，因此受到天下珍重。"
